name: Diagnose Gradle failure

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print Gradle failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89754678779/logs" \
            -o /tmp/build.log
          echo '--- matched Gradle errors ---'
          grep -E '(^|[[:space:]])(e:|error:)|FAILURE:|What went wrong|Execution failed|Unresolved reference|Expecting|Compilation error|Lint found|FAILED' /tmp/build.log | tail -n 100 || true
          echo '--- final 50 lines ---'
          tail -n 50 /tmp/build.log
