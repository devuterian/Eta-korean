name: PR comment smoke test

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/eta-actions-smoke')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `actions-smoke-ok run=${context.runId}`,
            })
