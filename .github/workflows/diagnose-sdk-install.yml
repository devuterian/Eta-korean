name: Diagnose Android SDK install

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print SDK install failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89753108001/logs" \
            -o /tmp/build.log
          echo '--- SDK-related errors ---'
          grep -E 'Failed to find package|Warning: Package|build-tools;|platforms;android-37|sdkmanager|channel|Error:|error:' /tmp/build.log | tail -n 60 || true
          echo '--- final 35 lines ---'
          tail -n 35 /tmp/build.log
