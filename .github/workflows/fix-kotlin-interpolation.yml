name: Fix Korean Kotlin interpolation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/korean-localization
          fetch-depth: 0

      - name: Repair interpolation before Korean suffixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'\$([A-Za-z_][A-Za-z0-9_]*)(?=[\uac00-\ud7a3])')
          changed = []
          replacements = 0
          for path in sorted(Path('app').rglob('*.kt')):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(r'${\1}', text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())
                  replacements += count
          print(f'repaired {replacements} interpolations in {len(changed)} files')
          for path in changed:
              print(path)
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No interpolation repairs required.'
            exit 0
          fi
          git commit -m 'fix Korean Kotlin interpolation'
          git push origin HEAD:agent/korean-localization
