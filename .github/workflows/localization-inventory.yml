name: Localization inventory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build localization inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          excluded = {'.git', '.gradle', 'build'}
          rows = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              matches = [(i, line.rstrip()) for i, line in enumerate(text.splitlines(), 1) if cjk.search(line)]
              if matches:
                  rows.append(f'## {path.as_posix()} ({len(matches)} lines)')
                  rows.extend(f'{line_no}: {line}' for line_no, line in matches)
                  rows.append('')
          Path('localization-inventory.txt').write_text('\n'.join(rows), encoding='utf-8')
          PY
          tar --exclude=.git --exclude=.gradle --exclude='**/build' --exclude=localization-inventory.txt -czf /tmp/source-snapshot.tar.gz .
          mv /tmp/source-snapshot.tar.gz source-snapshot.tar.gz

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: localization-inventory
          path: |
            localization-inventory.txt
            source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 3
