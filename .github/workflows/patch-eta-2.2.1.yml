name: Patch Eta 2.2.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/update-eta-2.2.1-ko' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/fuck/andes/ui/pages/providers/ModelProviderDetailScreen.kt')
          text = path.read_text(encoding='utf-8')
          old = 'text = "선택됨: $selectedCount개"'
          new = 'text = "선택됨: ${selectedCount}개"'
          if old not in text:
              raise SystemExit('expected interpolation text not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/fuck/andes/ui/pages/providers/ModelProviderDetailScreen.kt
          git commit -m "Eta 2.2.1 한국어 문자열 보간 수정"
          git push origin HEAD:agent/update-eta-2.2.1-ko
