name: Generate Korean translation candidates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: m2m100-418m-v1

      - name: Install translation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers<5' sentencepiece

      - name: Generate translation candidates
        shell: bash
        run: |
          cat > /tmp/generate_translations.py <<'PY'
          from __future__ import annotations

          from collections import defaultdict
          from pathlib import Path
          import json
          import re

          import torch
          from transformers import M2M100ForConditionalGeneration, M2M100Tokenizer

          ROOT = Path('.')
          CJK = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          TRIPLE = re.compile(r'"""(.*?)"""', re.S)
          NORMAL = re.compile(r'(?<!")"(?:\\.|[^"\\])*"')
          PLACEHOLDER = re.compile(
              r'https?://[^\s"<>]+|'
              r'\$\{[^{}]*\}|\$[A-Za-z_][A-Za-z0-9_]*|'
              r'`[^`]+`|'
              r'%\d*\$?[a-zA-Z]|'
              r'\\[nrt"\\]|'
              r'\b[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+\b'
          )

          def selected(path: Path) -> bool:
              s = path.as_posix()
              if any(part in {'.git', '.gradle', 'build'} for part in path.parts):
                  return False
              return (
                  s.startswith('app/src/main/')
                  or s == 'README.md'
                  or s.startswith('docs/')
              ) and path.suffix.lower() in {'.kt', '.xml', '.json', '.md'}

          entries: dict[str, list[dict[str, object]]] = defaultdict(list)

          def add(path: Path, line: int, raw: str, kind: str) -> None:
              if not CJK.search(raw):
                  return
              entries[raw].append({'path': path.as_posix(), 'line': line, 'kind': kind})

          for path in sorted(ROOT.rglob('*')):
              if not path.is_file() or not selected(path):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              if path.suffix == '.kt':
                  triple_spans = []
                  for match in TRIPLE.finditer(text):
                      triple_spans.append(match.span())
                      add(path, text.count('\n', 0, match.start()) + 1, match.group(1), 'kotlin_triple')
                  masked = list(text)
                  for start, end in triple_spans:
                      masked[start:end] = ' ' * (end - start)
                  masked_text = ''.join(masked)
                  for match in NORMAL.finditer(masked_text):
                      add(path, text.count('\n', 0, match.start()) + 1, match.group(0)[1:-1], 'kotlin_string')
              else:
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if CJK.search(line):
                          add(path, line_no, line, 'text_line')

          originals = sorted(entries, key=lambda value: (len(value), value))
          tokenizer = M2M100Tokenizer.from_pretrained('facebook/m2m100_418M')
          model = M2M100ForConditionalGeneration.from_pretrained('facebook/m2m100_418M')
          tokenizer.src_lang = 'zh'
          model.eval()

          def protect(text: str) -> tuple[str, dict[str, str]]:
              saved: dict[str, str] = {}
              def repl(match: re.Match[str]) -> str:
                  key = f'ZXQPH{len(saved)}QXZ'
                  saved[key] = match.group(0)
                  return key
              return PLACEHOLDER.sub(repl, text), saved

          def restore(text: str, saved: dict[str, str]) -> str:
              for key, value in saved.items():
                  variants = {key, key.replace('Q', ' Q '), key.lower(), key.upper()}
                  for variant in variants:
                      text = text.replace(variant, value)
                  text = re.sub(r'\s*'.join(map(re.escape, key)), value, text, flags=re.I)
              return text

          def translate_batch(values: list[str]) -> list[str]:
              protected = []
              saved_items = []
              for value in values:
                  masked, saved = protect(value)
                  protected.append(masked)
                  saved_items.append(saved)
              encoded = tokenizer(
                  protected,
                  return_tensors='pt',
                  padding=True,
                  truncation=True,
                  max_length=384,
              )
              with torch.inference_mode():
                  generated = model.generate(
                      **encoded,
                      forced_bos_token_id=tokenizer.get_lang_id('ko'),
                      max_new_tokens=384,
                      num_beams=4,
                      renormalize_logits=True,
                  )
              decoded = tokenizer.batch_decode(generated, skip_special_tokens=True)
              return [restore(text, saved).strip() for text, saved in zip(decoded, saved_items)]

          results = []
          batch_size = 12
          for start in range(0, len(originals), batch_size):
              batch = originals[start:start + batch_size]
              try:
                  translated = translate_batch(batch)
              except Exception as exc:
                  translated = [f'__TRANSLATION_ERROR__ {type(exc).__name__}: {exc}'] * len(batch)
              for original, korean in zip(batch, translated):
                  results.append({
                      'original': original,
                      'korean': korean,
                      'locations': entries[original],
                  })
              print(f'{min(start + batch_size, len(originals))}/{len(originals)}', flush=True)

          Path('korean-translation-candidates.json').write_text(
              json.dumps(results, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY
          python /tmp/generate_translations.py

      - name: Upload translation candidates
        uses: actions/upload-artifact@v4
        with:
          name: korean-translation-candidates
          path: korean-translation-candidates.json
          if-no-files-found: error
          retention-days: 3
