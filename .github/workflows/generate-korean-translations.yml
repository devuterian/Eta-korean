name: Generate Korean translation candidates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korean-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: m2m100-418m-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers<5' sentencepiece

      - name: Translate app source strings
        shell: bash
        run: |
          cat > /tmp/translate.py <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json, re, torch
          from transformers import M2M100ForConditionalGeneration, M2M100Tokenizer

          root = Path('.')
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          normal = re.compile(r'(?<!")"(?:\\.|[^"\\])*"')
          triple = re.compile(r'""".*?"""', re.S)
          token = re.compile(
              r'https?://[^\s"<>]+|\$\{[^{}]*\}|\$[A-Za-z_][A-Za-z0-9_]*|'
              r'`[^`]+`|%\d*\$?[a-zA-Z]|\\[nrt"\\]|'
              r'\b[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+\b'
          )
          excluded = {
              'app/src/main/kotlin/fuck/andes/agent/tool/WeChatMessageSender.kt',
              'app/src/main/kotlin/fuck/andes/agent/browser/BrowserDomScripts.kt',
          }

          def selected(path):
              rel = path.as_posix()
              if rel in excluded:
                  return False
              return (
                  rel.startswith('app/src/main/kotlin/fuck/andes/ui/')
                  or rel.startswith('app/src/main/kotlin/fuck/andes/agent/')
                  or rel.startswith('app/src/main/kotlin/fuck/andes/data/')
                  or rel.startswith('app/src/main/kotlin/fuck/andes/systemizer/')
                  or rel == 'app/src/main/kotlin/fuck/andes/config/Prefs.kt'
              )

          locations = defaultdict(list)
          for path in sorted(root.rglob('*.kt')):
              if not selected(path):
                  continue
              text = path.read_text('utf-8')
              spans = [m.span() for m in triple.finditer(text)]
              for match in normal.finditer(text):
                  if any(a <= match.start() < b for a, b in spans):
                      continue
                  value = match.group(0)[1:-1]
                  if cjk.search(value):
                      locations[value].append({
                          'path': path.as_posix(),
                          'line': text.count('\n', 0, match.start()) + 1,
                      })

          originals = sorted(locations, key=lambda s: (len(s), s))
          tokenizer = M2M100Tokenizer.from_pretrained('facebook/m2m100_418M')
          model = M2M100ForConditionalGeneration.from_pretrained('facebook/m2m100_418M')
          tokenizer.src_lang = 'zh'
          model.eval()
          torch.set_num_threads(4)

          def protect(value):
              saved = {}
              def repl(match):
                  key = f'ZXQPH{len(saved)}QXZ'
                  saved[key] = match.group(0)
                  return key
              return token.sub(repl, value), saved

          def restore(value, saved):
              for key, original in saved.items():
                  value = re.sub(r'\s*'.join(map(re.escape, key)), original, value, flags=re.I)
              return value.strip()

          result = []
          batch_size = 32
          for start in range(0, len(originals), batch_size):
              batch = originals[start:start + batch_size]
              protected, saved = zip(*(protect(value) for value in batch))
              encoded = tokenizer(
                  list(protected), return_tensors='pt', padding=True,
                  truncation=True, max_length=256,
              )
              with torch.inference_mode():
                  generated = model.generate(
                      **encoded,
                      forced_bos_token_id=tokenizer.get_lang_id('ko'),
                      max_new_tokens=256,
                      num_beams=1,
                  )
              translated = tokenizer.batch_decode(generated, skip_special_tokens=True)
              for original, korean, placeholders in zip(batch, translated, saved):
                  result.append({
                      'original': original,
                      'korean': restore(korean, placeholders),
                      'locations': locations[original],
                  })
              print(f'{min(start + batch_size, len(originals))}/{len(originals)}', flush=True)

          Path('korean-translation-candidates.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
          python /tmp/translate.py

      - uses: actions/upload-artifact@v4
        with:
          name: korean-translation-candidates
          path: korean-translation-candidates.json
          if-no-files-found: error
          retention-days: 3
