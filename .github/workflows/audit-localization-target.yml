name: Audit Eta localization update

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch main and upstream baseline
        run: |
          git fetch origin main
          git remote add upstream https://github.com/Mangi-11/Eta.git || true
          git fetch upstream 7eeb00cc4da8c857f2a046c4c1c056610e2c0b16

      - name: Audit remaining Chinese UI literals
        env:
          BASE_REF: origin/main
          OLD_UPSTREAM: 7eeb00cc4da8c857f2a046c4c1c056610e2c0b16
        run: |
          python3 - <<'PY'
          import difflib, os, pathlib, re, subprocess

          root = pathlib.Path('.')
          ui_roots = [
              pathlib.Path('app/src/main/kotlin/fuck/andes/ui'),
              pathlib.Path('app/src/main/kotlin/fuck/andes/agent/overlay'),
              pathlib.Path('app/src/main/kotlin/fuck/andes/systemizer'),
              pathlib.Path('app/src/main/res'),
          ]
          chinese = re.compile(r'[\u3400-\u9fff]')
          korean = re.compile(r'[가-힣]')
          quoted = re.compile(r'"(?:\\.|[^"\\])*"')

          def show(ref, path):
              p = subprocess.run(['git','show',f'{ref}:{path}'], text=True, capture_output=True)
              return p.stdout if p.returncode == 0 else None

          def literals(text):
              return [m.group(0) for m in quoted.finditer(text)]

          mapping = {}
          old_files = subprocess.check_output(['git','ls-tree','-r','--name-only',os.environ['OLD_UPSTREAM']], text=True).splitlines()
          for path in old_files:
              if not (path.endswith('.kt') or path.endswith('.xml')):
                  continue
              if not any(path == str(r) or path.startswith(str(r) + '/') for r in ui_roots):
                  continue
              old = show(os.environ['OLD_UPSTREAM'], path)
              base = show(os.environ['BASE_REF'], path)
              if old is None or base is None:
                  continue
              a, b = literals(old), literals(base)
              sm = difflib.SequenceMatcher(a=a, b=b, autojunk=False)
              for tag, i1, i2, j1, j2 in sm.get_opcodes():
                  if tag == 'replace' and (i2-i1) == (j2-j1):
                      for src, dst in zip(a[i1:i2], b[j1:j2]):
                          if chinese.search(src) and korean.search(dst):
                              mapping[src] = dst

          remaining = []
          for r in ui_roots:
              if not r.exists():
                  continue
              for p in r.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.kt','.xml'}:
                      continue
                  text = p.read_text(encoding='utf-8')
                  for src, dst in sorted(mapping.items(), key=lambda x: -len(x[0])):
                      text = text.replace(src, dst)
                  for n, line in enumerate(text.splitlines(), 1):
                      for m in quoted.finditer(line):
                          lit = m.group(0)
                          if chinese.search(lit):
                              remaining.append((str(p), n, lit))

          out = pathlib.Path('/tmp/localization-audit.md')
          with out.open('w', encoding='utf-8') as f:
              f.write('## Eta 2.5.0 현지화 감사\n\n')
              f.write(f'- 기존 한국어 치환 매핑: {len(mapping)}개\n')
              f.write(f'- 남은 중국어 UI 문자열: {len(remaining)}개\n\n')
              if remaining:
                  f.write('```text\n')
                  for path, line, lit in remaining:
                      f.write(f'{path}:{line}: {lit}\n')
                  f.write('```\n')
              else:
                  f.write('남은 중국어 UI 문자열이 없습니다.\n')
          PY

      - name: Comment audit result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file /tmp/localization-audit.md
