name: Apply Korean localization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-korean-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/korean-localization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download reviewed runtime and hook candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/code /tmp/hooks
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8626712414/zip" -o /tmp/code.zip
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8626754244/zip" -o /tmp/hooks.zip
          unzip -q /tmp/code.zip -d /tmp/code
          unzip -q /tmp/hooks.zip -d /tmp/hooks

      - name: Reconstruct deterministic UI mapping
        shell: bash
        run: |
          set -euo pipefail
          cat .localization/ui-map.part00 .localization/ui-map.part01 .localization/ui-map.part02 .localization/ui-map.part03 \
            | base64 --decode > /tmp/ui-map.json.bz2
          echo '6e7d5eb7a93efadfc12d881c6d2d4c87faa06c4baf5678d0feacfcd41ca3e43a  /tmp/ui-map.json.bz2' | sha256sum --check
          bzip2 --decompress --stdout /tmp/ui-map.json.bz2 > /tmp/ui-map.json
          echo '5aef05fbf5e4a1dd10498f70d416bbd6d5ba332129e8cf450fd055eacae895e5  /tmp/ui-map.json' | sha256sum --check

      - name: Apply reviewed Korean mappings
        shell: bash
        run: |
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path
          import json
          import re

          CJK = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')

          def scan(text):
              n = len(text)
              i = 0
              while i < n:
                  if text.startswith('//', i):
                      end = text.find('\n', i + 2)
                      i = n if end < 0 else end + 1
                      continue
                  if text.startswith('/*', i):
                      depth = 1
                      i += 2
                      while i < n and depth:
                          if text.startswith('/*', i):
                              depth += 1
                              i += 2
                          elif text.startswith('*/', i):
                              depth -= 1
                              i += 2
                          else:
                              i += 1
                      continue
                  if text.startswith('"""', i):
                      start = i
                      end = text.find('"""', i + 3)
                      if end < 0:
                          break
                      yield start, end + 3, text[i + 3:end], True
                      i = end + 3
                      continue
                  if text[i] == "'":
                      i += 1
                      while i < n:
                          if text[i] == '\\':
                              i += 2
                          elif text[i] == "'":
                              i += 1
                              break
                          else:
                              i += 1
                      continue
                  if text[i] != '"':
                      i += 1
                      continue
                  start = i
                  i += 1
                  content_start = i
                  depth = 0
                  while i < n:
                      char = text[i]
                      if char == '\\':
                          i += 2
                      elif depth == 0 and text.startswith('${', i):
                          depth = 1
                          i += 2
                      elif depth == 0 and char == '"':
                          yield start, i + 1, text[content_start:i], False
                          i += 1
                          break
                      elif depth > 0 and char in {'"', "'"}:
                          quote = char
                          i += 1
                          while i < n:
                              if text[i] == '\\':
                                  i += 2
                              elif text[i] == quote:
                                  i += 1
                                  break
                              else:
                                  i += 1
                      elif depth > 0 and char == '{':
                          depth += 1
                          i += 1
                      elif depth > 0 and char == '}':
                          depth -= 1
                          i += 1
                      else:
                          i += 1

          def apply(paths, mapping):
              changed = 0
              for path in paths:
                  text = path.read_text(encoding='utf-8')
                  edits = []
                  for start, end, value, triple in scan(text):
                      if value in mapping:
                          quote = '"""' if triple else '"'
                          edits.append((start, end, quote + mapping[value] + quote))
                  for start, end, replacement in reversed(edits):
                      text = text[:start] + replacement + text[end:]
                  if edits:
                      path.write_text(text, encoding='utf-8')
                      changed += len(edits)
              return changed

          code = {row['original']: row['korean'] for row in json.loads(Path('/tmp/code/korean-translation-candidates-github-models.json').read_text(encoding='utf-8'))}
          hooks = {row['original']: row['korean'] for row in json.loads(Path('/tmp/hooks/korean-hook-candidates.json').read_text(encoding='utf-8'))}
          ui = json.loads(Path('/tmp/ui-map.json').read_text(encoding='utf-8'))

          files = sorted(Path('.').rglob('*.kt'))
          runtime_files = [path for path in files if path.as_posix().startswith('app/src/main/kotlin/fuck/andes/') and '/ui/' not in path.as_posix() and '/hook/' not in path.as_posix() and not path.as_posix().endswith('/agent/browser/BrowserDomScripts.kt')]
          hook_files = [path for path in files if path.as_posix().startswith('app/src/main/kotlin/fuck/andes/hook/')]
          ui_files = [path for path in files if path.as_posix().startswith('app/src/main/kotlin/fuck/andes/ui/')]
          test_files = [path for path in files if '/src/test/' in path.as_posix() or '/src/androidTest/' in path.as_posix()]

          print('runtime:', apply(runtime_files, code))
          print('hooks:', apply(hook_files, hooks))
          print('ui:', apply(ui_files, ui))
          print('tests:', apply(test_files, {**code, **hooks, **ui}))

          def replace(path, old, new):
              file = Path(path)
              file.write_text(file.read_text(encoding='utf-8').replace(old, new), encoding='utf-8')

          replace('app/src/main/kotlin/fuck/andes/data/db/FuckAndesDatabase.kt', "WHERE title = '새 대화' ", "WHERE title = '新对话' ")
          replace('app/src/main/kotlin/fuck/andes/agent/overlay/AgentOverlayContent.kt', 'text = "发送",', 'text = "전송",')
          replace('app/src/main/kotlin/fuck/andes/agent/browser/BrowserDomScripts.kt', "'[图片：' + markdownEscape(alt) + ']'", "'[이미지: ' + markdownEscape(alt) + ']'")
          replace('app/src/main/kotlin/fuck/andes/ui/SettingsScreen.kt', '$message：$it', '$message: $it')
          replace('app/src/main/kotlin/fuck/andes/agent/model/AgentLoop.kt', '"：$it"', '": $it"')
          replace('app/src/main/kotlin/fuck/andes/hook/breeno/BreenoHooks.kt', "Eta 설정에서 '小布自定义模型'을 먼저 활성화하세요.", "Eta 설정에서 'Breeno 사용자 지정 모델'을 먼저 활성화하세요.")

          allowed = {
              ('app/src/main/kotlin/fuck/andes/agent/tool/WeChatMessageSender.kt', '搜索'),
              ('app/src/main/kotlin/fuck/andes/agent/tool/WeChatMessageSender.kt', '发送'),
              ('app/src/main/kotlin/fuck/andes/data/db/FuckAndesDatabase.kt', "WHERE title = '新对话' "),
              ('app/src/main/kotlin/fuck/andes/hook/breeno/BreenoHooks.kt', '深度思考'),
          }
          unexpected = []
          for path in sorted(Path('app/src/main').rglob('*.kt')):
              text = path.read_text(encoding='utf-8')
              for start, _, value, triple in scan(text):
                  if not CJK.search(value):
                      continue
                  rel = path.as_posix()
                  if triple and rel.endswith('/AgentStructuredDeviceTools.kt'):
                      continue
                  if (rel, value) in allowed:
                      continue
                  unexpected.append((rel, text.count('\n', 0, start) + 1, value))
          if unexpected:
              raise RuntimeError(f'unexpected Chinese strings: {unexpected[:20]!r}')
          PY
          python /tmp/apply.py

      - name: Commit localized app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git diff --cached --check
          git commit -m 'localize app in Korean'
          git push origin HEAD:agent/korean-localization
