          print('UI translations:', apply_mapping(ui_paths, ui_mapping))

          db = Path('app/src/main/kotlin/fuck/andes/data/db/FuckAndesDatabase.kt')
          db.write_text(db.read_text(encoding='utf-8').replace("WHERE title = '새 대화' ", "WHERE title = '新对话' "), encoding='utf-8')
