          from __future__ import annotations

          from collections import defaultdict
          from pathlib import Path
          import base64
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          ROOT = Path('.')
          CJK = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')

          def scan_strings(text: str):
              n = len(text)
              i = 0
              while i < n:
                  if text.startswith('//', i):
                      end = text.find('\n', i + 2)
                      i = n if end < 0 else end + 1
                      continue
                  if text.startswith('/*', i):
                      depth = 1
                      i += 2
                      while i < n and depth:
                          if text.startswith('/*', i):
                              depth += 1
                              i += 2
                          elif text.startswith('*/', i):
                              depth -= 1
                              i += 2
                          else:
                              i += 1
                      continue
                  if text.startswith('"""', i):
                      start = i
                      end = text.find('"""', i + 3)
                      if end < 0:
                          break
                      yield start, end + 3, text[i + 3:end], True
                      i = end + 3
                      continue
                  if text[i] == "'":
                      i += 1
                      while i < n:
                          if text[i] == '\\':
                              i += 2
                          elif text[i] == "'":
                              i += 1
                              break
                          else:
                              i += 1
                      continue
                  if text[i] != '"':
                      i += 1
                      continue
                  start = i
                  i += 1
                  content_start = i
                  interpolation_depth = 0
                  while i < n:
                      ch = text[i]
                      if ch == '\\':
                          i += 2
                      elif interpolation_depth == 0 and text.startswith('${', i):
                          interpolation_depth = 1
                          i += 2
                      elif interpolation_depth == 0 and ch == '"':
                          yield start, i + 1, text[content_start:i], False
                          i += 1
                          break
                      elif interpolation_depth > 0 and ch in {'"', "'"}:
                          quote = ch
                          i += 1
                          while i < n:
                              if text[i] == '\\':
                                  i += 2
                              elif text[i] == quote:
                                  i += 1
                                  break
                              else:
                                  i += 1
                      elif interpolation_depth > 0 and ch == '{':
                          interpolation_depth += 1
                          i += 1
                      elif interpolation_depth > 0 and ch == '}':
                          interpolation_depth -= 1
                          i += 1
                      else:
                          i += 1

          def apply_mapping(paths, mapping):
              changed = 0
              for path in paths:
                  text = path.read_text(encoding='utf-8')
                  edits = []
                  for start, end, value, triple in scan_strings(text):
                      if value not in mapping:
                          continue
                      quote = '"""' if triple else '"'
                      edits.append((start, end, quote + mapping[value] + quote))
                  for start, end, replacement in reversed(edits):
                      text = text[:start] + replacement + text[end:]
                  if edits:
                      path.write_text(text, encoding='utf-8')
                      changed += len(edits)
              return changed

          code_rows = json.loads(Path('/tmp/code-candidates/korean-translation-candidates-github-models.json').read_text(encoding='utf-8'))
          hook_rows = json.loads(Path('/tmp/hook-candidates/korean-hook-candidates.json').read_text(encoding='utf-8'))
          code_mapping = {row['original']: row['korean'] for row in code_rows}
          hook_mapping = {row['original']: row['korean'] for row in hook_rows}

          all_kotlin = sorted(ROOT.rglob('*.kt'))
          non_ui = [p for p in all_kotlin if p.as_posix().startswith('app/src/main/kotlin/fuck/andes/') and '/ui/' not in p.as_posix() and '/hook/' not in p.as_posix() and not p.as_posix().endswith('/agent/browser/BrowserDomScripts.kt')]
          hooks = [p for p in all_kotlin if '/app/src/main/kotlin/fuck/andes/hook/' in '/' + p.as_posix()]
          tests = [p for p in all_kotlin if '/src/test/' in p.as_posix() or '/src/androidTest/' in p.as_posix()]

          print('code translations:', apply_mapping(non_ui, code_mapping))
          print('hook translations:', apply_mapping(hooks, hook_mapping))
          print('test expectations:', apply_mapping(tests, {**code_mapping, **hook_mapping}))

          ui_locations = defaultdict(list)
          ui_paths = [p for p in all_kotlin if '/app/src/main/kotlin/fuck/andes/ui/' in '/' + p.as_posix()]
          for path in ui_paths:
              text = path.read_text(encoding='utf-8')
              for start, _, value, _ in scan_strings(text):
                  if CJK.search(value):
                      ui_locations[value].append({'path': path.as_posix(), 'line': text.count('\n', 0, start) + 1})
          ui_originals = sorted(ui_locations, key=lambda value: (ui_locations[value][0]['path'], ui_locations[value][0]['line']))

          system_prompt = '\n'.join([
              'You are a senior Korean Android UI localizer.',
              'Translate Simplified Chinese UI labels, descriptions, dialogs, status text, and preview text into concise natural Korean.',
              'Return valid JSON only: {"translations":[{"source":"...","target":"..."}]}.',
              'Return every input exactly once in the original order and preserve each source field byte-for-byte.',
              'Preserve Kotlin interpolation, escaped sequences, markdown, URLs, package names, API names, tool IDs, argument names, enum values, file paths, and technical tokens exactly.',
              'Terminology: Agent=에이전트, Provider=제공자, Skill=스킬, 小布=Breeno, 一圈即搜=서클 투 서치, 微信=WeChat.',
              'Use standard Korean Android UI wording. Do not add explanations or markdown outside translated source content.',
          ])
          endpoint = 'https://models.github.ai/inference/chat/completions'
          token = os.environ['GITHUB_TOKEN']

          def translate_batch(batch):
              payload = {'model': 'openai/gpt-4.1', 'temperature': 0, 'response_format': {'type': 'json_object'}, 'messages': [{'role': 'system', 'content': system_prompt}, {'role': 'user', 'content': json.dumps({'strings': batch}, ensure_ascii=False)}]}
              request = urllib.request.Request(endpoint, data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), method='POST', headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'})
              last_error = None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          envelope = json.loads(response.read().decode('utf-8'))
                      rows = json.loads(envelope['choices'][0]['message']['content'])['translations']
                      if [row.get('source') for row in rows] != batch:
