name: Apply Korean localization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: apply-korean-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/korean-localization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download reviewed candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/code /tmp/hooks
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8626712414/zip" -o /tmp/code.zip
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8626754244/zip" -o /tmp/hooks.zip
          unzip -q /tmp/code.zip -d /tmp/code
          unzip -q /tmp/hooks.zip -d /tmp/hooks
      - name: Apply runtime, hook, and UI translations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/apply.py <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json, os, re, time, urllib.error, urllib.request

          CJK=re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          def scan(text):
              n=len(text); i=0
              while i<n:
                  if text.startswith('//',i):
                      e=text.find('\n',i+2); i=n if e<0 else e+1; continue
                  if text.startswith('/*',i):
                      d=1; i+=2
                      while i<n and d:
                          if text.startswith('/*',i):d+=1;i+=2
                          elif text.startswith('*/',i):d-=1;i+=2
                          else:i+=1
                      continue
                  if text.startswith('"""',i):
                      s=i;e=text.find('"""',i+3)
                      if e<0:break
                      yield s,e+3,text[i+3:e],True;i=e+3;continue
                  if text[i]=="'":
                      i+=1
                      while i<n:
                          if text[i]=='\\':i+=2
                          elif text[i]=="'":i+=1;break
                          else:i+=1
                      continue
                  if text[i]!='"':i+=1;continue
                  s=i;i+=1;cs=i;d=0
                  while i<n:
                      c=text[i]
                      if c=='\\':i+=2
                      elif d==0 and text.startswith('${',i):d=1;i+=2
                      elif d==0 and c=='"':yield s,i+1,text[cs:i],False;i+=1;break
                      elif d>0 and c in {'"',"'"}:
                          q=c;i+=1
                          while i<n:
                              if text[i]=='\\':i+=2
                              elif text[i]==q:i+=1;break
                              else:i+=1
                      elif d>0 and c=='{':d+=1;i+=1
                      elif d>0 and c=='}':d-=1;i+=1
                      else:i+=1

          def apply(paths,mapping):
              total=0
              for path in paths:
                  text=path.read_text('utf-8');edits=[]
                  for s,e,v,triple in scan(text):
                      if v in mapping:
                          q='"""' if triple else '"';edits.append((s,e,q+mapping[v]+q))
                  for s,e,r in reversed(edits):text=text[:s]+r+text[e:]
                  if edits:path.write_text(text,'utf-8');total+=len(edits)
              return total

          code={x['original']:x['korean'] for x in json.loads(Path('/tmp/code/korean-translation-candidates-github-models.json').read_text())}
          hooks={x['original']:x['korean'] for x in json.loads(Path('/tmp/hooks/korean-hook-candidates.json').read_text())}
          files=sorted(Path('.').rglob('*.kt'))
          nonui=[p for p in files if p.as_posix().startswith('app/src/main/kotlin/fuck/andes/') and '/ui/' not in p.as_posix() and '/hook/' not in p.as_posix() and not p.as_posix().endswith('/agent/browser/BrowserDomScripts.kt')]
          hookfiles=[p for p in files if p.as_posix().startswith('app/src/main/kotlin/fuck/andes/hook/')]
          tests=[p for p in files if '/src/test/' in p.as_posix() or '/src/androidTest/' in p.as_posix()]
          print('runtime',apply(nonui,code),'hooks',apply(hookfiles,hooks),'tests',apply(tests,{**code,**hooks}))

          ui=[p for p in files if p.as_posix().startswith('app/src/main/kotlin/fuck/andes/ui/')]
          locations=defaultdict(list)
          for p in ui:
              text=p.read_text('utf-8')
              for s,_,v,_ in scan(text):
                  if CJK.search(v):locations[v].append((p.as_posix(),text.count('\n',0,s)+1))
          originals=sorted(locations,key=lambda v:locations[v][0])
          prompt='\n'.join([
              'Translate Simplified Chinese Android UI strings into concise natural Korean.',
              'Return JSON only as {"translations":[{"source":"...","target":"..."}]}, every input once in the original order.',
              'Preserve source exactly and preserve Kotlin interpolation, escapes, markdown, URLs, package/API/tool/argument/enum/file-path tokens.',
              'Terminology: Agent=에이전트, Provider=제공자, Skill=스킬, 小布=Breeno, 一圈即搜=서클 투 서치, 微信=WeChat.',
          ])
          token=os.environ['GITHUB_TOKEN'];endpoint='https://models.github.ai/inference/chat/completions'
          def translate(batch):
              body={'model':'openai/gpt-4.1','temperature':0,'response_format':{'type':'json_object'},'messages':[{'role':'system','content':prompt},{'role':'user','content':json.dumps({'strings':batch},ensure_ascii=False)}]}
              req=urllib.request.Request(endpoint,data=json.dumps(body,ensure_ascii=False).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'})
              last=None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req,timeout=180) as r:env=json.loads(r.read())
                      rows=json.loads(env['choices'][0]['message']['content'])['translations']
                      if [x.get('source') for x in rows]!=batch:raise ValueError('source mismatch')
                      return rows
                  except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError,ValueError,KeyError,json.JSONDecodeError) as e:
                      last=e
                      if isinstance(e,urllib.error.HTTPError) and e.code not in {408,429,500,502,503,504}:raise
                      time.sleep(90 if isinstance(e,urllib.error.HTTPError) and e.code==429 else min(60,3*(2**attempt)))
              raise RuntimeError(last)
          uim={}
          for i in range(0,len(originals),120):
              batch=originals[i:i+120]
              for row in translate(batch):uim[row['source']]=row['target']
              print('ui',min(i+120,len(originals)),'/',len(originals),flush=True);time.sleep(30)
          print('ui applied',apply(ui,uim))

          def replace(path,a,b):
              p=Path(path);p.write_text(p.read_text('utf-8').replace(a,b),'utf-8')
          replace('app/src/main/kotlin/fuck/andes/data/db/FuckAndesDatabase.kt',"WHERE title = '새 대화' ","WHERE title = '新对话' ")
          replace('app/src/main/kotlin/fuck/andes/agent/overlay/AgentOverlayContent.kt','text = "发送",','text = "전송",')
          replace('app/src/main/kotlin/fuck/andes/agent/browser/BrowserDomScripts.kt',"'[图片：' + markdownEscape(alt) + ']'","'[이미지: ' + markdownEscape(alt) + ']'")
          replace('app/src/main/kotlin/fuck/andes/ui/SettingsScreen.kt','$message：$it','$message: $it')
          replace('app/src/main/kotlin/fuck/andes/agent/model/AgentLoop.kt','"：$it"','": $it"')
          replace('app/src/main/kotlin/fuck/andes/hook/breeno/BreenoHooks.kt',"Eta 설정에서 '小布自定义模型'을 먼저 활성화하세요.","Eta 설정에서 'Breeno 사용자 지정 모델'을 먼저 활성화하세요.")

          allowed={
              ('app/src/main/kotlin/fuck/andes/agent/tool/WeChatMessageSender.kt','搜索'),
              ('app/src/main/kotlin/fuck/andes/agent/tool/WeChatMessageSender.kt','发送'),
              ('app/src/main/kotlin/fuck/andes/data/db/FuckAndesDatabase.kt',"WHERE title = '新对话' "),
              ('app/src/main/kotlin/fuck/andes/hook/breeno/BreenoHooks.kt','深度思考'),
          }
          unexpected=[]
          for p in sorted(Path('app/src/main').rglob('*.kt')):
              text=p.read_text('utf-8')
              for s,_,v,triple in scan(text):
                  if not CJK.search(v):continue
                  rel=p.as_posix()
                  if triple and (rel.endswith('/BrowserDomScripts.kt') or rel.endswith('/AgentStructuredDeviceTools.kt')):continue
                  if (rel,v) in allowed:continue
                  unexpected.append((rel,text.count('\n',0,s)+1,v))
          if unexpected:raise RuntimeError('unexpected CJK: '+repr(unexpected[:20]))
          PY
          python /tmp/apply.py
      - name: Commit localized app source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git diff --cached --check
          git commit -m 'localize app in Korean'
          git push origin HEAD:agent/korean-localization
