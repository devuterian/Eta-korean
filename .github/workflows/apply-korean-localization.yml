          loop = Path('app/src/main/kotlin/fuck/andes/agent/model/AgentLoop.kt')
          loop.write_text(loop.read_text(encoding='utf-8').replace('"：$it"', '": $it"'), encoding='utf-8')
          breeno = Path('app/src/main/kotlin/fuck/andes/hook/breeno/BreenoHooks.kt')
