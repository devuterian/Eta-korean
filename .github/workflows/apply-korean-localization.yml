에이전트 루프와 런타임 설계는 [docs/AGENT_RUNTIME.md](docs/AGENT_RUNTIME.md), 시스템 훅과 RemotePreferences 구조는 [docs/TECHNICAL.md](docs/TECHNICAL.md)를 참고하세요. 기술 문서는 현재 원문을 유지합니다.

