name: Apply Korean localization

on:
  push:
    branches: [agent/korean-localization]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: apply-korean-localization
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/korean-localization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download reviewed translation candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/code-candidates /tmp/hook-candidates
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8626712414/zip" \
            -o /tmp/code.zip
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8626754244/zip" \
            -o /tmp/hooks.zip
          unzip -q /tmp/code.zip -d /tmp/code-candidates
          unzip -q /tmp/hooks.zip -d /tmp/hook-candidates

      - name: Apply localization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          README_B64: IyBFdGEg7ZWc6rWt7Ja07YyQ  용 Android AI 에이전트입니다.</p>

> 이 저장소는 [Mangi-11/Eta](https://github.com/Mangi-11/Eta)의 한국어 현지화 포크입니다. 앱의 사용자 노출 문구와 에이전트 메시지를 한국어로 번역하며, 원본의 도구 식별자·프로토콜·외부 앱 자동화용 고정 문자열은 호환성을 위해 유지합니다.

Eta는 libxposed API 102 기반 Xposed 모듈이며 ColorOS 16을 대상으로 합니다. Breeno 대화 요청을 가로채 같은 에이전트 런타임으로 전달하고, BYOK 방식으로 사용자가 선택한 모델을 연결합니다. 앱 본체가 기본 작업 공간이며 Gemini 호출과 서클 투 서치 관련 초기 훅도 포함합니다.

