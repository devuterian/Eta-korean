                      return rows
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError, KeyError, json.JSONDecodeError) as exc:
                      last_error = exc
                      if isinstance(exc, urllib.error.HTTPError) and exc.code not in {408, 429, 500, 502, 503, 504}:
                          raise
                      time.sleep(min(60, 3 * (2 ** attempt)))
              raise RuntimeError(f'UI translation failed: {last_error}')

          ui_mapping = {}
          for start in range(0, len(ui_originals), 28):
              batch = ui_originals[start:start + 28]
              for row in translate_batch(batch):
