          Path('.github/workflows/android-apk.yml').write_bytes(base64.b64decode(os.environ['ANDROID_WORKFLOW_B64']))
          Path('app/src/main/res/values/strings.xml').write_bytes(base64.b64decode(os.environ['STRINGS_XML_B64']))
          PY
