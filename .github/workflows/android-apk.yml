name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo 'Could not read versionName.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=Eta-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          TOOLS_ZIP="$RUNNER_TEMP/android-command-line-tools.zip"
          TOOLS_DIR="$RUNNER_TEMP/android-command-line-tools"
          curl -fsSLo "$TOOLS_ZIP" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$TOOLS_ZIP" \
            | sha256sum -c -

          rm -rf "$TOOLS_DIR" "$ANDROID_SDK_ROOT"
          mkdir -p "$TOOLS_DIR" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          mv "$TOOLS_DIR/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --list --channel=3 \
            | awk -F '|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' \
            > "$RUNNER_TEMP/android-sdk-packages.txt"

          PLATFORM_PACKAGE=''
          for candidate in \
            'platforms;android-37.0' \
            'platforms;android-37' \
            'platforms;android-CinnamonBun'; do
            if grep -Fxq "$candidate" "$RUNNER_TEMP/android-sdk-packages.txt"; then
              PLATFORM_PACKAGE="$candidate"
              break
            fi
          done
          if [[ -z "$PLATFORM_PACKAGE" ]]; then
            echo 'Android 17 platform package was not found.' >&2
            grep -E '^platforms;android-(37|CinnamonBun)' "$RUNNER_TEMP/android-sdk-packages.txt" || true
            exit 1
          fi

          BUILD_TOOLS_PACKAGE="$({ grep -E '^build-tools;37\.' "$RUNNER_TEMP/android-sdk-packages.txt" || true; } | sort -V | tail -n 1)"
          if [[ -z "$BUILD_TOOLS_PACKAGE" ]]; then
            echo 'Android Build-Tools 37 package was not found.' >&2
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE and $BUILD_TOOLS_PACKAGE"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --channel=3 \
            'platform-tools' "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE" \
            'ndk;29.0.14206865'
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleDebug

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eta-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/$APK_NAME"
          NOTES=/tmp/eta-release-notes.md
          cat > "$NOTES" <<EOF
          Eta ${VERSION} 한국어 현지화 빌드입니다.

          - upstream 버전: ${VERSION}
          - 빌드: GitHub Actions debug APK
          - 커밋: ${GITHUB_SHA}
          - Actions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "Eta $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$VERSION" "$APK_PATH" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Eta $VERSION" --notes-file "$NOTES"
          fi
