name: Android APK

on:
  push:
    branches: [main, agent/korean-localization]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK root
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install current Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_ZIP=/tmp/android-command-line-tools.zip
          TOOLS_DIR=/tmp/android-command-line-tools
          curl -fsSLo "$TOOLS_ZIP" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-command-line-tools.zip' \
            | sha256sum -c -

          rm -rf "$TOOLS_DIR" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$TOOLS_DIR" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          mv "$TOOLS_DIR/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 \
            | awk -F '|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' \
            > /tmp/android-sdk-packages.txt

          PLATFORM_PACKAGE=''
          for candidate in \
            'platforms;android-37' \
            'platforms;android-37.0' \
            'platforms;android-CinnamonBun'; do
            if grep -Fxq "$candidate" /tmp/android-sdk-packages.txt; then
              PLATFORM_PACKAGE="$candidate"
              break
            fi
          done
          if [[ -z "$PLATFORM_PACKAGE" ]]; then
            echo 'Android 17 platform package was not found.' >&2
            grep -E '^platforms;android-(37|CinnamonBun)' /tmp/android-sdk-packages.txt || true
            exit 1
          fi

          BUILD_TOOLS_PACKAGE="$({ grep -E '^build-tools;37\.' /tmp/android-sdk-packages.txt || true; } | sort -V | tail -n 1)"
          if [[ -z "$BUILD_TOOLS_PACKAGE" ]]; then
            echo 'Android Build-Tools 37 package was not found.' >&2
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE and $BUILD_TOOLS_PACKAGE"
          "$SDKMANAGER" --channel=3 \
            'platform-tools' "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"
          chmod +x gradlew

      - name: Test, lint, and build APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eta-korean-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
