name: Android APK

on:
  push:
    branches: [main, agent/korean-localization]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read Korean version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_SUFFIX="$(sed -nE 's/^[[:space:]]*versionNameSuffix = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"

          if [[ -z "$BASE_VERSION" ]]; then
            echo 'Could not read versionName from app/build.gradle.kts.' >&2
            exit 1
          fi
          if [[ "$VERSION_SUFFIX" != '-ko' ]]; then
            echo "Expected Korean versionNameSuffix '-ko', got '$VERSION_SUFFIX'." >&2
            exit 1
          fi

          VERSION="${BASE_VERSION}${VERSION_SUFFIX}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=Eta-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK root
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install current Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_ZIP=/tmp/android-command-line-tools.zip
          TOOLS_DIR=/tmp/android-command-line-tools
          curl -fsSLo "$TOOLS_ZIP" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/android-command-line-tools.zip' \
            | sha256sum -c -

          rm -rf "$TOOLS_DIR" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$TOOLS_DIR" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          unzip -q "$TOOLS_ZIP" -d "$TOOLS_DIR"
          mv "$TOOLS_DIR/cmdline-tools/"* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 \
            | awk -F '|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' \
            > /tmp/android-sdk-packages.txt

          PLATFORM_PACKAGE=''
          for candidate in \
            'platforms;android-37' \
            'platforms;android-37.0' \
            'platforms;android-CinnamonBun'; do
            if grep -Fxq "$candidate" /tmp/android-sdk-packages.txt; then
              PLATFORM_PACKAGE="$candidate"
              break
            fi
          done
          if [[ -z "$PLATFORM_PACKAGE" ]]; then
            echo 'Android 17 platform package was not found.' >&2
            grep -E '^platforms;android-(37|CinnamonBun)' /tmp/android-sdk-packages.txt || true
            exit 1
          fi

          BUILD_TOOLS_PACKAGE="$({ grep -E '^build-tools;37\.' /tmp/android-sdk-packages.txt || true; } | sort -V | tail -n 1)"
          if [[ -z "$BUILD_TOOLS_PACKAGE" ]]; then
            echo 'Android Build-Tools 37 package was not found.' >&2
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE and $BUILD_TOOLS_PACKAGE"
          "$SDKMANAGER" --channel=3 \
            'platform-tools' "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace --console=plain assembleDebug

      - name: Name APK for release
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk \
            "app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eta-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/$APK_NAME"
          NOTES_FILE=/tmp/eta-release-notes.md
          cat > "$NOTES_FILE" <<EOF
          Eta ${VERSION} 한국어 현지화 빌드입니다.

          - 원본 Eta 버전: ${VERSION%-ko}
          - 한국어판 버전: ${VERSION}
          - 빌드: GitHub Actions debug APK
          - 커밋: ${GITHUB_SHA}
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Eta $VERSION" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Eta $VERSION" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports-${{ github.sha }}
          path: app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  sync_eta_2_2_1:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/update-eta-2.2.1-ko' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Merge upstream and preserve Korean localization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Mangi-11/Eta.git
          git fetch upstream main

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 && -z "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Upstream merge failed without resolvable file conflicts." >&2
            exit $merge_status
          fi

          python3 .github/scripts/sync_upstream_2_2_1.py

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git add -A
          git status --short
          git commit -m "Eta 2.2.1-ko 업데이트"
          git push origin HEAD:agent/update-eta-2.2.1-ko
