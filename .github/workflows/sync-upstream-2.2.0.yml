name: Sync upstream Eta 2.2.0

on:
  push:
    branches: [agent/update-eta-2.2.0-ko]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-eta-2.2.0-ko
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Korean update branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream and preserve Korean localization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Mangi-11/Eta.git
          git fetch upstream main

          set +e
          git merge --no-commit --no-ff upstream/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 && -z "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Upstream merge failed without resolvable file conflicts." >&2
            exit $merge_status
          fi

          python3 <<'PY'
          from __future__ import annotations

          import difflib
          import pathlib
          import re
          import subprocess

          STRING_RE = re.compile(r'"(?:\\.|[^"\\])*"')
          CJK_RE = re.compile(r'[\u3400-\u9fff]')
          HANGUL_RE = re.compile(r'[\uac00-\ud7a3]')

          def git(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  ["git", *args],
                  check=check,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

          def stage(path: str, number: int) -> str | None:
              result = git("show", f":{number}:{path}", check=False)
              return result.stdout if result.returncode == 0 else None

          def normalized(line: str) -> str:
              return STRING_RE.sub('""', line)

          def collect_translation_map(base: str, ours: str) -> dict[str, str]:
              mapping: dict[str, str] = {}
              base_lines = base.splitlines()
              ours_lines = ours.splitlines()

              base_index: dict[str, list[str]] = {}
              ours_index: dict[str, list[str]] = {}
              for line in base_lines:
                  base_index.setdefault(normalized(line), []).append(line)
              for line in ours_lines:
                  ours_index.setdefault(normalized(line), []).append(line)

              def map_line(base_line: str, ours_line: str) -> None:
                  base_strings = STRING_RE.findall(base_line)
                  ours_strings = STRING_RE.findall(ours_line)
                  if len(base_strings) != len(ours_strings):
                      return
                  for source, target in zip(base_strings, ours_strings):
                      if source == target:
                          continue
                      if CJK_RE.search(source) and HANGUL_RE.search(target):
                          mapping[source] = target

              for key in base_index.keys() & ours_index.keys():
                  if len(base_index[key]) == 1 and len(ours_index[key]) == 1:
                      map_line(base_index[key][0], ours_index[key][0])

              base_norm = [normalized(line) for line in base_lines]
              ours_norm = [normalized(line) for line in ours_lines]
              matcher = difflib.SequenceMatcher(a=base_norm, b=ours_norm, autojunk=False)
              for block in matcher.get_matching_blocks():
                  for offset in range(block.size):
                      map_line(base_lines[block.a + offset], ours_lines[block.b + offset])
              return mapping

          conflicts = [
              path for path in git("diff", "--name-only", "--diff-filter=U").stdout.splitlines()
              if path
          ]
          keep_korean_docs = {"README.md", "docs/TECHNICAL.md"}
          binary_suffixes = {".jpg", ".jpeg", ".png", ".gif", ".webp"}

          for path in conflicts:
              suffix = pathlib.Path(path).suffix.lower()
              if path in keep_korean_docs:
                  git("checkout", "--ours", "--", path)
                  git("add", "--", path)
                  continue
              if suffix in binary_suffixes:
                  theirs = stage(path, 3)
                  if theirs is None:
                      git("rm", "--", path)
                  else:
                      git("checkout", "--theirs", "--", path)
                      git("add", "--", path)
                  continue

              base = stage(path, 1)
              ours = stage(path, 2)
              theirs = stage(path, 3)
              if theirs is None:
                  git("rm", "--", path)
                  continue
              if base is None or ours is None:
                  pathlib.Path(path).write_text(theirs, encoding="utf-8")
                  git("add", "--", path)
                  continue

              merged = theirs
              for source, target in collect_translation_map(base, ours).items():
                  merged = merged.replace(source, target)
              pathlib.Path(path).write_text(merged, encoding="utf-8")
              git("add", "--", path)

          replacements = {
              "app/src/main/kotlin/fuck/andes/ui/SettingsScreen.kt": {
                  '"系统助手接管"': '"시스템 어시스턴트 연동"',
                  '"启用系统助手自定义模型"': '"시스템 어시스턴트에서 사용자 지정 모델 사용"',
                  '"小布与超级小爱共用此开关"': '"Breeno와 슈퍼 샤오아이가 이 설정을 함께 사용합니다"',
                  '"仅 /agent 前缀接管"': '"/agent 접두사가 있을 때만 처리"',
                  '"同时适用于小布与超级小爱"': '"Breeno와 슈퍼 샤오아이에 모두 적용됩니다"',
                  '"未选择模型"': '"모델을 선택하지 않음"',
                  '"未配置"': '"설정되지 않음"',
              },
              "app/src/main/kotlin/fuck/andes/hook/xiaoai/XiaoAiHandoff.kt": {
                  '"超级小爱对话"': '"슈퍼 샤오아이 대화"',
                  '"超级小爱：${firstLine.take(ARCHIVE_TITLE_CHARS)}"': '"슈퍼 샤오아이: ${firstLine.take(ARCHIVE_TITLE_CHARS)}"',
              },
              "app/src/main/kotlin/fuck/andes/hook/xiaoai/XiaoAiStreamRenderer.kt": {
                  '"Eta 正在思考…"': '"Eta가 생각하고 있어요…"',
                  '"Eta 正在执行任务…"': '"Eta가 작업을 수행하고 있어요…"',
                  '"Eta 已完成本轮任务"': '"Eta가 이번 작업을 완료했어요"',
                  '"Eta 处理失败，请稍后重试"': '"Eta가 처리하지 못했어요. 잠시 후 다시 시도해 주세요."',
              },
          }
          for file_name, file_replacements in replacements.items():
              path = pathlib.Path(file_name)
              text = path.read_text(encoding="utf-8")
              for source, target in file_replacements.items():
                  text = text.replace(source, target)
              path.write_text(text, encoding="utf-8")
              git("add", "--", file_name)

          build_file = pathlib.Path("app/build.gradle.kts")
          build_text = build_file.read_text(encoding="utf-8")
          if 'versionNameSuffix = "-ko"' not in build_text:
              build_text = build_text.replace(
                  '        versionName = "2.2.0"\n',
                  '        versionName = "2.2.0"\n        versionNameSuffix = "-ko"\n',
              )
          build_file.write_text(build_text, encoding="utf-8")
          git("add", "--", str(build_file))

          readme = pathlib.Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          readme_text = readme_text.replace(
              "Breeno 대화 요청을 가로채 같은 에이전트 런타임으로 전달하고, BYOK 방식으로 사용자가 선택한 모델을 연결합니다.",
              "Breeno와 Xiaomi 슈퍼 샤오아이의 대화 요청을 같은 에이전트 런타임으로 전달하고, BYOK 방식으로 사용자가 선택한 모델을 연결합니다.",
          )
          readme_text = readme_text.replace(
              "| 채팅 홈 | 시스템 분석 | 명령 실행 |",
              "| 채팅 홈 | 시스템 분석 | 기기 직접 제어 |",
          ).replace(
              "| ![채팅 홈](docs/Screenshots/chat_home.jpg) | ![시스템 분석](docs/Screenshots/chat_breeno_analysis.jpg) | ![명령 실행](docs/Screenshots/chat_command.jpg) |",
              "| ![채팅 홈](docs/Screenshots/chat_home.jpg) | ![시스템 분석](docs/Screenshots/chat_breeno_analysis.jpg) | ![기기 직접 제어](docs/Screenshots/chat_device_direct.jpg) |",
          )
          readme_text = readme_text.replace(
              "2. 모듈 범위에 `system`, `SystemUI`, Google 앱, Breeno 관련 프로세스를 포함합니다.",
              "2. 모듈 범위에 `system`, `SystemUI`, Google 앱, Breeno 및 지원되는 Xiaomi 슈퍼 샤오아이 프로세스를 포함합니다.",
          )
          readme_text = readme_text.replace(
              "- Android 최소 버전: API 36",
              "- Android 최소 버전: API 34",
          )
          readme_text = readme_text.replace(
              "├── hook/                  시스템·Google·Breeno 훅",
              "├── hook/                  시스템·Google·Breeno·슈퍼 샤오아이 훅",
          )
          if "### Xiaomi 슈퍼 샤오아이" not in readme_text:
              marker = "### 내장 브라우저\n"
              section = (
                  "### Xiaomi 슈퍼 샤오아이\n\n"
                  "지원되는 슈퍼 샤오아이 버전에서는 시스템 어시스턴트 요청을 Eta 모델로 전달하고, "
                  "텍스트·이미지 입력과 스트리밍 결과 카드 및 음성 읽기를 연동합니다. 정확한 앱 버전이 맞지 않으면 원래 동작을 유지합니다.\n\n"
              )
              readme_text = readme_text.replace(marker, section + marker)
          readme.write_text(readme_text, encoding="utf-8")
          git("add", "--", str(readme))

          audit_files = [
              "app/src/main/kotlin/fuck/andes/ui/SettingsScreen.kt",
              "app/src/main/kotlin/fuck/andes/ui/app/AgentAppState.kt",
              "app/src/main/kotlin/fuck/andes/ui/components/AgentChatBody.kt",
              "app/src/main/kotlin/fuck/andes/ui/components/AgentChatInputBar.kt",
              "app/src/main/kotlin/fuck/andes/ui/components/ChatMessageItem.kt",
              "app/src/main/kotlin/fuck/andes/ui/components/SmoothTextReveal.kt",
              "app/src/main/kotlin/fuck/andes/hook/xiaoai/XiaoAiHandoff.kt",
              "app/src/main/kotlin/fuck/andes/hook/xiaoai/XiaoAiStreamRenderer.kt",
          ]
          leftovers: list[str] = []
          for file_name in audit_files:
              for number, line in enumerate(pathlib.Path(file_name).read_text(encoding="utf-8").splitlines(), 1):
                  code = line.split("//", 1)[0]
                  literals = STRING_RE.findall(code)
                  if any(CJK_RE.search(literal) for literal in literals):
                      leftovers.append(f"{file_name}:{number}: {line.strip()}")
          if leftovers:
              print("Untranslated Chinese string literals remain in user-facing files:")
              print("\n".join(leftovers))
              raise SystemExit(1)
          PY

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          rm -f .github/workflows/sync-upstream-2.2.0.yml
          git add -A
          git status --short
          git commit -m "Eta 2.2.0-ko 업데이트"
          git push origin HEAD:agent/update-eta-2.2.0-ko
