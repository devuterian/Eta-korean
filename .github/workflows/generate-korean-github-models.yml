name: Generate Korean translations with GitHub Models

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: github-models-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate reviewed-format translation candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > /tmp/translate.py <<'PY'
          from __future__ import annotations

          from collections import defaultdict
          from pathlib import Path
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          ROOT = Path('.')
          CJK = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          ENDPOINT = 'https://models.github.ai/inference/chat/completions'
          MODEL = 'openai/gpt-4.1'
          TOKEN = os.environ['GITHUB_TOKEN']
          BATCH_SIZE = 24

          EXCLUDED_FILES = {
              'app/src/main/kotlin/fuck/andes/agent/browser/BrowserDomScripts.kt',
          }
          PROTECTED_EXACT = {
              '搜索',
              '发送',
              '新对话',
          }

          def selected(path: Path) -> bool:
              rel = path.as_posix()
              if rel in EXCLUDED_FILES:
                  return False
              if '/src/test/' in rel or '/src/androidTest/' in rel:
                  return False
              if '/hook/' in rel or '/ui/' in rel:
                  return False
              if not rel.startswith('app/src/main/kotlin/fuck/andes/'):
                  return False
              return True

          def scan_strings(text: str):
              n = len(text)
              i = 0
              while i < n:
                  if text.startswith('//', i):
                      end = text.find('\n', i + 2)
                      i = n if end < 0 else end + 1
                      continue
                  if text.startswith('/*', i):
                      end = text.find('*/', i + 2)
                      i = n if end < 0 else end + 2
                      continue
                  if text.startswith('"""', i):
                      start = i
                      end = text.find('"""', i + 3)
                      if end < 0:
                          break
                      yield start, end + 3, text[i + 3:end], True
                      i = end + 3
                      continue
                  if text[i] == "'":
                      i += 1
                      while i < n:
                          if text[i] == '\\':
                              i += 2
                          elif text[i] == "'":
                              i += 1
                              break
                          else:
                              i += 1
                      continue
                  if text[i] != '"':
                      i += 1
                      continue
                  start = i
                  i += 1
                  content_start = i
                  depth = 0
                  while i < n:
                      ch = text[i]
                      if ch == '\\':
                          i += 2
                      elif depth == 0 and text.startswith('${', i):
                          depth = 1
                          i += 2
                      elif depth == 0 and ch == '"':
                          yield start, i + 1, text[content_start:i], False
                          i += 1
                          break
                      elif depth > 0 and ch in {'"', "'"}:
                          quote = ch
                          i += 1
                          while i < n:
                              if text[i] == '\\':
                                  i += 2
                              elif text[i] == quote:
                                  i += 1
                                  break
                              else:
                                  i += 1
                      elif depth > 0 and ch == '{':
                          depth += 1
                          i += 1
                      elif depth > 0 and ch == '}':
                          depth -= 1
                          i += 1
                      else:
                          i += 1

          locations: dict[str, list[dict[str, object]]] = defaultdict(list)
          for path in sorted(ROOT.rglob('*.kt')):
              if not selected(path):
                  continue
              text = path.read_text(encoding='utf-8')
              for start, _, value, is_triple in scan_strings(text):
                  if is_triple or not CJK.search(value) or value in PROTECTED_EXACT:
                      continue
                  locations[value].append({
                      'path': path.as_posix(),
                      'line': text.count('\n', 0, start) + 1,
                  })

          originals = sorted(locations, key=lambda value: (locations[value][0]['path'], locations[value][0]['line']))

          system_prompt = '''You are a senior Korean software localizer for an Android AI-agent application.
Translate Simplified Chinese user-facing strings into natural, concise Korean.
Rules:
- Return valid JSON only, in exactly this shape: {"translations":[{"source":"...","target":"..."}]}.
- Preserve each source string byte-for-byte in the source field and return every input exactly once in the original order.
- Preserve Kotlin interpolation and code tokens exactly: $name, ${expression}, escaped sequences, URLs, package names, tool IDs, argument names, enum values, commands, JSON keys, file paths, HTTP/API/SSL/SDK/Root/Shell terms.
- Translate Agent as 에이전트, Provider as 제공자, Skill as 스킬, 小布 as Breeno, 一圈即搜 as 서클 투 서치, 微信 as WeChat.
- Use Korean UI/error-message style. Avoid literal or literary wording. Keep technical warnings precise.
- Do not add explanations, markdown, or quotation commentary.'''

          def request_translation(batch: list[str]) -> list[dict[str, str]]:
              payload = {
                  'model': MODEL,
                  'temperature': 0,
                  'response_format': {'type': 'json_object'},
                  'messages': [
                      {'role': 'system', 'content': system_prompt},
                      {'role': 'user', 'content': json.dumps({'strings': batch}, ensure_ascii=False)},
                  ],
              }
              body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(
                  ENDPOINT,
                  data=body,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {TOKEN}',
                      'Content-Type': 'application/json',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2026-03-10',
                  },
              )
              last_error = None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req, timeout=180) as response:
                          envelope = json.loads(response.read().decode('utf-8'))
                      content = envelope['choices'][0]['message']['content']
                      parsed = json.loads(content)
                      translations = parsed['translations']
                      if [row.get('source') for row in translations] != batch:
                          raise ValueError('model response source/order mismatch')
                      if any(not isinstance(row.get('target'), str) or not row['target'].strip() for row in translations):
                          raise ValueError('empty target in model response')
                      return translations
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, KeyError, ValueError, json.JSONDecodeError) as exc:
                      last_error = exc
                      if isinstance(exc, urllib.error.HTTPError):
                          detail = exc.read().decode('utf-8', errors='replace')
                          print(f'HTTP {exc.code}: {detail[:500]}', flush=True)
                          if exc.code not in {408, 429, 500, 502, 503, 504}:
                              raise
                      time.sleep(min(60, 3 * (2 ** attempt)))
              raise RuntimeError(f'translation request failed: {last_error}')

          output = []
          for start in range(0, len(originals), BATCH_SIZE):
              batch = originals[start:start + BATCH_SIZE]
              translated = request_translation(batch)
              for row in translated:
                  output.append({
                      'original': row['source'],
                      'korean': row['target'],
                      'locations': locations[row['source']],
                  })
              print(f'{min(start + BATCH_SIZE, len(originals))}/{len(originals)}', flush=True)
              time.sleep(1)

          Path('korean-translation-candidates-github-models.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY
          python /tmp/translate.py

      - uses: actions/upload-artifact@v4
        with:
          name: korean-translation-candidates-github-models
          path: korean-translation-candidates-github-models.json
          if-no-files-found: error
          retention-days: 3
