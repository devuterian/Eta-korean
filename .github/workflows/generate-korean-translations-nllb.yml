name: Generate Korean translation candidates NLLB

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korean-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-200-distilled-600m-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers<5' sentencepiece

      - name: Translate app source strings
        shell: bash
        run: |
          cat > /tmp/translate_nllb.py <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json
          import re
          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

          root = Path('.')
          cjk = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          protected_token = re.compile(
              r'https?://[^\s"<>]+|`[^`]+`|%\d*\$?[a-zA-Z]|\\[nrt"\\]|'
              r'\b[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+\b'
          )
          excluded = {
              'app/src/main/kotlin/fuck/andes/agent/tool/WeChatMessageSender.kt',
              'app/src/main/kotlin/fuck/andes/agent/browser/BrowserDomScripts.kt',
          }

          def selected(path):
              rel = path.as_posix()
              if rel in excluded:
                  return False
              return (
                  rel.startswith('app/src/main/kotlin/fuck/andes/ui/')
                  or rel.startswith('app/src/main/kotlin/fuck/andes/agent/')
                  or rel.startswith('app/src/main/kotlin/fuck/andes/data/')
                  or rel.startswith('app/src/main/kotlin/fuck/andes/systemizer/')
                  or rel == 'app/src/main/kotlin/fuck/andes/config/Prefs.kt'
              )

          def scan_strings(text):
              n = len(text)
              i = 0
              while i < n:
                  if text.startswith('"""', i):
                      end = text.find('"""', i + 3)
                      if end < 0:
                          return
                      yield i, end + 3, text[i + 3:end], True
                      i = end + 3
                      continue
                  if text[i] != '"':
                      i += 1
                      continue
                  start = i
                  i += 1
                  content_start = i
                  depth = 0
                  while i < n:
                      char = text[i]
                      if char == '\\':
                          i += 2
                      elif depth == 0 and text.startswith('${', i):
                          depth = 1
                          i += 2
                      elif depth == 0 and char == '"':
                          yield start, i + 1, text[content_start:i], False
                          i += 1
                          break
                      elif depth > 0 and char in {'"', "'"}:
                          quote = char
                          i += 1
                          while i < n:
                              if text[i] == '\\':
                                  i += 2
                              elif text[i] == quote:
                                  i += 1
                                  break
                              else:
                                  i += 1
                      elif depth > 0 and char == '{':
                          depth += 1
                          i += 1
                      elif depth > 0 and char == '}':
                          depth -= 1
                          i += 1
                      else:
                          i += 1

          def interpolation_tokens(raw):
              values = []
              i = 0
              while i < len(raw):
                  if raw.startswith('${', i):
                      start = i
                      depth = 1
                      i += 2
                      while i < len(raw) and depth:
                          if raw[i] == '\\':
                              i += 2
                          elif raw[i] in {'"', "'"}:
                              quote = raw[i]
                              i += 1
                              while i < len(raw):
                                  if raw[i] == '\\':
                                      i += 2
                                  elif raw[i] == quote:
                                      i += 1
                                      break
                                  else:
                                      i += 1
                          elif raw[i] == '{':
                              depth += 1
                              i += 1
                          elif raw[i] == '}':
                              depth -= 1
                              i += 1
                          else:
                              i += 1
                      values.append(raw[start:i])
                  elif raw[i] == '$' and i + 1 < len(raw) and (raw[i + 1].isalpha() or raw[i + 1] == '_'):
                      start = i
                      i += 2
                      while i < len(raw) and (raw[i].isalnum() or raw[i] == '_'):
                          i += 1
                      values.append(raw[start:i])
                  else:
                      i += 1
              return values

          locations = defaultdict(list)
          for path in sorted(root.rglob('*.kt')):
              if not selected(path):
                  continue
              text = path.read_text('utf-8')
              for start, _, value, is_triple in scan_strings(text):
                  if not is_triple and cjk.search(value):
                      locations[value].append({
                          'path': path.as_posix(),
                          'line': text.count('\n', 0, start) + 1,
                      })

          originals = sorted(locations, key=lambda value: (len(value), value))
          model_name = 'facebook/nllb-200-distilled-600M'
          tokenizer = AutoTokenizer.from_pretrained(model_name, src_lang='zho_Hans')
          model = AutoModelForSeq2SeqLM.from_pretrained(model_name)
          model.eval()
          torch.set_num_threads(4)

          def protect(value):
              saved = {}
              def store(original):
                  key = f'ZXQPH{len(saved)}QXZ'
                  saved[key] = original
                  return key
              for original in interpolation_tokens(value):
                  value = value.replace(original, store(original), 1)
              value = protected_token.sub(lambda match: store(match.group(0)), value)
              return value, saved

          def restore(value, saved):
              for key, original in saved.items():
                  value = re.sub(r'\s*'.join(map(re.escape, key)), original, value, flags=re.I)
              return value.strip()

          results = []
          batch_size = 32
          for start in range(0, len(originals), batch_size):
              batch = originals[start:start + batch_size]
              protected, saved = zip(*(protect(value) for value in batch))
              inputs = tokenizer(
                  list(protected), return_tensors='pt', padding=True,
                  truncation=True, max_length=256,
              )
              with torch.inference_mode():
                  outputs = model.generate(
                      **inputs,
                      forced_bos_token_id=tokenizer.convert_tokens_to_ids('kor_Hang'),
                      max_new_tokens=256,
                      num_beams=1,
                  )
              translated = tokenizer.batch_decode(outputs, skip_special_tokens=True)
              for original, korean, placeholders in zip(batch, translated, saved):
                  results.append({
                      'original': original,
                      'korean': restore(korean, placeholders),
                      'locations': locations[original],
                  })
              print(f'{min(start + batch_size, len(originals))}/{len(originals)}', flush=True)

          Path('korean-translation-candidates-nllb.json').write_text(
              json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
          python /tmp/translate_nllb.py

      - uses: actions/upload-artifact@v4
        with:
          name: korean-translation-candidates-nllb
          path: korean-translation-candidates-nllb.json
          if-no-files-found: error
          retention-days: 3
