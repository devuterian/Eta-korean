name: Temporary upstream sync

on:
  push:
    branches: [agent/upstream-2.2.0-ko]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream while preserving Korean conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Mangi-11/Eta.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is already incorporated."
            exit 0
          fi

          git merge --no-edit -X ours upstream/main

          python3 - <<'PY'
          from pathlib import Path
          import re

          upstream = Path('/tmp/upstream-build.gradle.kts')
          current = Path('app/build.gradle.kts')
          upstream.write_text(
              __import__('subprocess').check_output(
                  ['git', 'show', 'upstream/main:app/build.gradle.kts'], text=True
              ),
              encoding='utf-8',
          )
          upstream_text = upstream.read_text(encoding='utf-8')
          text = current.read_text(encoding='utf-8')

          def value(pattern: str, source: str) -> str:
              match = re.search(pattern, source, re.MULTILINE)
              if not match:
                  raise SystemExit(f'Could not find {pattern!r}')
              return match.group(1)

          version_code = value(r'^\s*versionCode\s*=\s*(\d+)\s*$', upstream_text)
          version_name = value(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', upstream_text)
          min_sdk = value(r'^\s*minSdk\s*=\s*(\d+)\s*$', upstream_text)

          text = re.sub(r'^(\s*minSdk\s*=\s*)\d+\s*$', rf'\g<1>{min_sdk}', text, flags=re.MULTILINE)
          text = re.sub(r'^(\s*versionCode\s*=\s*)\d+\s*$', rf'\g<1>{version_code}', text, flags=re.MULTILINE)
          text = re.sub(r'^(\s*versionName\s*=\s*)"[^"]+"\s*$', rf'\g<1>"{version_name}"', text, flags=re.MULTILINE)
          if 'versionNameSuffix = "-ko"' not in text:
              text = re.sub(
                  r'^(\s*versionName\s*=\s*"[^"]+"\s*)$',
                  r'\1\n        versionNameSuffix = "-ko"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          current.write_text(text, encoding='utf-8')
          PY

          git add app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "한국어판 버전 2.2.0-ko 적용 [skip ci]"
          fi
          git push origin HEAD:agent/upstream-2.2.0-ko
