name: Diagnose localization failure

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Print failed job error
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89751448572/logs" \
            -o /tmp/job.log
          echo '--- matched errors ---'
          grep -E 'fatal:|error:|rejected|denied|nothing to commit|Process completed|workflow' /tmp/job.log | tail -n 35 || true
          echo '--- final 30 lines ---'
          tail -n 30 /tmp/job.log
