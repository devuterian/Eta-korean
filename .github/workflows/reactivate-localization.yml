name: Reactivate Korean localization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reactivate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/korean-localization
          fetch-depth: 0
      - name: Restore rate-limited applicator
        shell: bash
        run: |
          set -euo pipefail
          git show 20cffde5d2ffd348785e969b05e557e2fd829670:.github/workflows/apply-korean-localization.yml > .github/workflows/apply-korean-localization.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-korean-localization.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('for i in range(0,len(originals),28):', 'for i in range(0,len(originals),120):')
          text = text.replace('batch=originals[i:i+28]', 'batch=originals[i:i+120]')
          text = text.replace("print('ui',min(i+28,len(originals)),'/',len(originals),flush=True);time.sleep(1)", "print('ui',min(i+120,len(originals)),'/',len(originals),flush=True);time.sleep(30)")
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/diagnose-localization-log.yml .github/workflows/reactivate-localization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'reduce localization model request rate'
          git push origin HEAD:agent/korean-localization
