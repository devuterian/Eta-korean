name: Sync Eta 2.5.1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/update-eta-2.5.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Cherry-pick Eta 2.5.1 and preserve Korean localization
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'versionName = "2.5.1"' app/build.gradle.kts && [ -f .github/eta-2.5.1-localization-audit.txt ]; then
            echo "Eta 2.5.1 sync already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          KO_BASE="$(git rev-parse HEAD)"
          OLD_UPSTREAM="aefd2a4dda1428e64dd0fd0cb09d8ebf94f1fd26"
          NEW_UPSTREAM="49bf47268052b13ac385ba3844747f3c4d24aefd"

          git remote add upstream https://github.com/Mangi-11/Eta.git || true
          git fetch upstream main --tags

          python3 - "$OLD_UPSTREAM" "$NEW_UPSTREAM" "$KO_BASE" <<'PY'
          import collections
          import difflib
          import json
          import pathlib
          import re
          import subprocess
          import sys

          old, new, ko = sys.argv[1:4]
          cjk = re.compile(r"[\u3400-\u9fff]")
          hangul = re.compile(r"[가-힣]")
          quote = re.compile(r'"(?:\\.|[^"\\])*"')

          def show(ref, path):
              p = subprocess.run(["git", "show", f"{ref}:{path}"], text=True, capture_output=True)
              return p.stdout if p.returncode == 0 else None

          def paths(ref):
              return subprocess.check_output(["git", "ls-tree", "-r", "--name-only", ref], text=True).splitlines()

          mapping = {}
          for path in paths(old):
              if not (path.startswith("app/src/main/kotlin/") or path.startswith("app/src/main/res/")):
                  continue
              if not path.endswith((".kt", ".xml")):
                  continue
              a = show(old, path)
              b = show(ko, path)
              if a is None or b is None:
                  continue
              al = a.splitlines()
              bl = b.splitlines()
              sm = difflib.SequenceMatcher(a=al, b=bl, autojunk=False)
              pairs = []
              for tag, i1, i2, j1, j2 in sm.get_opcodes():
                  if tag != "replace" or (i2-i1) != (j2-j1):
                      continue
                  for src, dst in zip(al[i1:i2], bl[j1:j2]):
                      if cjk.search(src) and hangul.search(dst):
                          pairs.append([src, dst])
              if pairs:
                  mapping[path] = pairs
          pathlib.Path("/tmp/eta-ko-line-map.json").write_text(
              json.dumps(mapping, ensure_ascii=False), encoding="utf-8"
          )

          new_chinese = {}
          all_paths = sorted(set(paths(old)) | set(paths(new)))
          for path in all_paths:
              if not (path.startswith("app/src/main/kotlin/") or path.startswith("app/src/main/res/")):
                  continue
              if not path.endswith((".kt", ".xml")):
                  continue
              a = show(old, path) or ""
              b = show(new, path) or ""
              ca = collections.Counter(x for x in quote.findall(a) if cjk.search(x))
              cb = collections.Counter(x for x in quote.findall(b) if cjk.search(x))
              added = []
              for lit, count in cb.items():
                  extra = count - ca.get(lit, 0)
                  if extra > 0:
                      added.extend([lit] * extra)
              if added:
                  new_chinese[path] = added
          pathlib.Path("/tmp/eta-new-chinese.json").write_text(
              json.dumps(new_chinese, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

          git cherry-pick -X theirs "$OLD_UPSTREAM..$NEW_UPSTREAM"

          python3 - <<'PY'
          import json
          import pathlib

          mapping = json.loads(pathlib.Path("/tmp/eta-ko-line-map.json").read_text(encoding="utf-8"))
          changed = 0
          for path, pairs in mapping.items():
              p = pathlib.Path(path)
              if not p.is_file():
                  continue
              text = p.read_text(encoding="utf-8")
              lines = text.splitlines()
              replacements = dict(pairs)
              new_lines = [replacements.get(line, line) for line in lines]
              new_text = "\n".join(new_lines) + ("\n" if text.endswith("\n") else "")
              if new_text != text:
                  p.write_text(new_text, encoding="utf-8")
                  changed += 1
          print(f"Reapplied Korean localization in {changed} file(s).")
          PY

          # Keep the Korean README instead of replacing it with the upstream Chinese README.
          git checkout "$KO_BASE" -- README.md

          python3 - <<'PY'
          import json
          import pathlib

          new_chinese = json.loads(pathlib.Path("/tmp/eta-new-chinese.json").read_text(encoding="utf-8"))
          remaining = []
          for path, literals in new_chinese.items():
              p = pathlib.Path(path)
              if not p.is_file():
                  continue
              text = p.read_text(encoding="utf-8")
              for lit in literals:
                  if lit in text:
                      remaining.append((path, lit))

          report = [
              "Eta 2.5.1 localization audit",
              "",
              f"Remaining newly introduced Chinese string literals: {len(remaining)}",
              "",
          ]
          for path, lit in remaining:
              report.append(f"{path}: {lit}")
          pathlib.Path(".github/eta-2.5.1-localization-audit.txt").write_text(
              "\n".join(report) + "\n", encoding="utf-8"
          )
          print("\n".join(report[:80]))
          PY

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Eta 2.5.1 upstream 동기화"
          git push origin HEAD:agent/update-eta-2.5.1
