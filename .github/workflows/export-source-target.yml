name: Export source snapshots for update

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - name: Package snapshots
        run: |
          rm -rf head/.git base/.git
          tar -czf eta-source-snapshots.tar.gz head base

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: eta-source-snapshots
          path: eta-source-snapshots.tar.gz
          if-no-files-found: error
